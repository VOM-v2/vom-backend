name: 📐 Task
description: ERD, API 명세서 등 설계 및 문서 작업
assignees: okodeee

body:
  - type: textarea
    attributes:
      label: 📋 작업 개요
      description: 어떤 설계/문서 작업인지 설명해주세요
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📌 상세 작업 내용
      description: 구체적으로 수행할 작업들을 체크리스트로 작성해주세요
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: ✅ 완료 조건
      options: 
        - label: 노션 문서에 업데이트
        - label: 관련 코드와 일치
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📚 참고 자료
